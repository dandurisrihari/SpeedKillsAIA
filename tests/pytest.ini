[tool:pytest]
# Pytest configuration for SpeedKillsAIA modules

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --timeout=60
    --timeout-method=thread

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests across modules
    cli: Command-line interface tests
    slow: Tests that take longer to run
    module: Tests for module structure and imports
    kernel_instrumenter: Tests specific to kernel_instrumenter module
    preprocess: Tests specific to preprocess module
    
# Minimum Python version
minversion = 3.8

# Test timeout (in seconds) - individual test timeout
timeout = 60

# Directories to ignore
norecursedirs = 
    .git
    .pytest_cache
    __pycache__
    *.egg-info
    venv
    .venv
    
# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning:tree_sitter*
